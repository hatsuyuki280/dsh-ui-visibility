name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const expected = `v${pkg.version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            console.error(`tag ${process.env.GITHUB_REF_NAME} does not match package ${expected}`);
            process.exit(1);
          }
          NODE
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Pack release asset
        run: npm pack --pack-destination dist
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --verify-tag
