name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const expected = `v${pkg.version}`;
          if (process.env.GITHUB_REF_NAME !== expected) {
            console.error(`tag ${process.env.GITHUB_REF_NAME} does not match package ${expected}`);
            process.exit(1);
          }
          NODE
      - name: Publish with provenance (OIDC)
        run: npm publish --provenance --access public
      - name: Verify published version
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          (async () => {
            const url = `https://registry.npmjs.org/${pkg.name}/${pkg.version}`;
            const deadline = Date.now() + 6 * 60 * 1000;
            while (true) {
              try {
                const response = await fetch(url, { cache: 'no-store' });
                if (response.ok) {
                  console.log(`${pkg.name}@${pkg.version} is live on npm.`);
                  return;
                }
                console.log(`${pkg.name}@${pkg.version} not visible yet (HTTP ${response.status}); retrying...`);
              } catch (error) {
                console.log(`registry check failed (${error.message}); retrying...`);
              }
              if (Date.now() >= deadline) {
                console.error(`npm version ${pkg.name}@${pkg.version} did not become live within 6 minutes.`);
                console.error('If this publish was staged, approve the staged version before creating a release.');
                process.exit(1);
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Pack release asset
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --verify-tag
