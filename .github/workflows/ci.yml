name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Verify package contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/pack.json', 'utf8'));
          const entry = Array.isArray(data) ? data[0] : data;
          const got = entry.files.map((file) => file.path).sort();
          const want = [
            'CHANGELOG.md',
            'LICENSE',
            'README.md',
            'cordis.patch.yml',
            'lib/client.js',
            'lib/index.js',
            'package.json',
          ].sort();
          if (JSON.stringify(got) !== JSON.stringify(want)) {
            console.error('unexpected package contents:', got);
            process.exit(1);
          }
          NODE
      - name: Verify packed file modes
        run: |
          npm pack --pack-destination /tmp >/dev/null
          bad="$(tar tvf /tmp/dsh-ui-visibility-*.tgz | awk '$1 != "-rw-r--r--" { print }')"
          if [ -n "$bad" ]; then
            echo "non-0644 entries:"
            echo "$bad"
            exit 1
          fi
